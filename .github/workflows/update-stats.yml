name: Update stats

# Lookups are requested from the website by opening an issue titled
# "lookup:<PLATFORM>:<profile name>". Only issues opened by the repo owner run,
# so nobody else can spend the API key. Profiles already fetched are refreshed hourly.
on:
  issues:
    types: [opened]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: update-stats
  cancel-in-progress: false

jobs:
  update:
    if: >-
      github.event_name != 'issues' ||
      (startsWith(github.event.issue.title, 'lookup:') &&
       github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch stats
        env:
          APEX_API_KEY: ${{ secrets.APEX_API_KEY }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          EVENT: ${{ github.event_name }}
        run: |
          set -uo pipefail
          : > "$RUNNER_TEMP/targets.tsv"
          : > "$RUNNER_TEMP/result.md"

          if [ "$EVENT" = "issues" ]; then
            rest="${ISSUE_TITLE#lookup:}"
            platform="${rest%%:*}"
            player="$(printf '%s' "${rest#*:}" | sed 's/^[[:space:]]*//;s/[[:space:]]*$//')"
            case "$platform" in PC|PS4|X1|SWITCH) ;; *)
              echo "❌ Unknown platform \`$platform\`." >> "$RUNNER_TEMP/result.md"; exit 0;;
            esac
            if [ -z "$player" ] || [ "${#player}" -gt 64 ]; then
              echo "❌ Missing or invalid profile name." >> "$RUNNER_TEMP/result.md"; exit 0
            fi
            printf '%s\t%s\n' "$platform" "$player" >> "$RUNNER_TEMP/targets.tsv"
          else
            for f in stats/*/*.json; do
              [ -e "$f" ] || continue
              jq -r 'select(.global) | [.request.platform, .request.player] | @tsv' "$f" >> "$RUNNER_TEMP/targets.tsv"
            done
          fi

          strip='del(.updated, .realtime, .lastError, .lastErrorAt)'
          while IFS=$'\t' read -r platform player; do
            [ -n "$player" ] || continue
            # Same slug rule as the website: ASCII-lowercase, anything else -> "_"
            slug=$(jq -rn --arg p "$player" '$p | ascii_downcase | gsub("[^a-z0-9_-]"; "_")')
            out="stats/$platform/$slug.json"
            mkdir -p "stats/$platform"
            enc=$(jq -rn --arg p "$player" '$p | @uri')
            code=$(curl -sS -o raw.json -w '%{http_code}' -H "Authorization: $APEX_API_KEY" \
              "https://api.mozambiquehe.re/bridge?player=${enc}&platform=${platform}") || code=000

            if [ "$code" = "200" ] && jq -e '(.global | type == "object") and (has("Error") | not)' raw.json >/dev/null 2>&1; then
              jq --arg pl "$player" --arg pf "$platform" \
                '{updated: (now|todate), request: {player: $pl, platform: $pf}, global, realtime, legends: {selected: .legends.selected}}' \
                raw.json > new.json
              if [ "$EVENT" != "issues" ] && [ -f "$out" ] && \
                 [ "$(jq -S "$strip" "$out")" = "$(jq -S "$strip" new.json)" ]; then
                rm new.json   # hourly refresh, nothing changed
              else
                mv new.json "$out"
              fi
              echo "✅ Stats updated for **$player** ($platform)." >> "$RUNNER_TEMP/result.md"
            else
              err=$(jq -r '.Error // empty' raw.json 2>/dev/null || true)
              err="${err:-HTTP $code}"
              echo "❌ Lookup failed for **$player** ($platform): $err" >> "$RUNNER_TEMP/result.md"
              if [ "$EVENT" = "issues" ]; then
                if jq -e '.global' "$out" >/dev/null 2>&1; then
                  jq --arg e "$err" '.lastError = $e | .lastErrorAt = (now|todate)' "$out" > new.json && mv new.json "$out"
                else
                  jq -n --arg e "$err" --arg pl "$player" --arg pf "$platform" \
                    '{request: {player: $pl, platform: $pf}, lastError: $e, lastErrorAt: (now|todate)}' > "$out"
                fi
              fi
            fi
            rm -f raw.json
            sleep 2   # be gentle with the API
          done < "$RUNNER_TEMP/targets.tsv"

      - name: Commit
        run: |
          git add -A stats 2>/dev/null || true
          if git diff --cached --quiet; then echo "No changes."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update stats"
          for i in 1 2 3; do git push && exit 0; git pull --rebase; done
          exit 1

      - name: Reply and close issue
        if: always() && github.event_name == 'issues'
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
        run: |
          body=$(cat "$RUNNER_TEMP/result.md" 2>/dev/null)
          body="${body:-❌ Lookup failed. See the workflow run for details.}"
          gh issue close "$NUM" -R "$GITHUB_REPOSITORY" --comment "$body

          The site will show it within a minute: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
